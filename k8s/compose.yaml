name: k8s-task-demo

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: task
      POSTGRES_PASSWORD: task
      POSTGRES_DB: taskdb
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U task -d taskdb"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    image: task-app:dev
    build:
      context: .
    entrypoint: ["/app/migrate"]
    environment:
      DATABASE_URL: postgres://task:task@postgres:5432/taskdb?sslmode=disable
      APP_ENV: development
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  app:
    image: task-app:dev
    build:
      context: .
    environment:
      HTTP_ADDR: :8080
      DATABASE_URL: postgres://task:task@postgres:5432/taskdb?sslmode=disable
      APP_ENV: development
      SHUTDOWN_TIMEOUT: 10s
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/health/ready >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    stop_grace_period: 20s
    restart: unless-stopped

volumes:
  postgres-data:
