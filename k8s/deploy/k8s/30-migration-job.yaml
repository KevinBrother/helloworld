apiVersion: batch/v1
kind: Job
metadata:
  name: task-app-migrate
  namespace: task-demo
  labels:
    app.kubernetes.io/name: task-app
    app.kubernetes.io/component: migration
    app.kubernetes.io/part-of: k8s-task-demo
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: task-app
        app.kubernetes.io/component: migration
        app.kubernetes.io/part-of: k8s-task-demo
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: task-app:dev
          imagePullPolicy: Never
          command: ["/app/migrate"]
          envFrom:
            - configMapRef:
                name: task-app-config
            - secretRef:
                name: task-demo-database
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
