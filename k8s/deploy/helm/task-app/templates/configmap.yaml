apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "task-app.fullname" . }}-config
  labels:
    {{- include "task-app.labels" . | nindent 4 }}
data:
  APP_ENV: {{ .Values.config.appEnv | quote }}
  HTTP_ADDR: {{ .Values.config.httpAddr | quote }}
  SHUTDOWN_TIMEOUT: {{ .Values.config.shutdownTimeout | quote }}

