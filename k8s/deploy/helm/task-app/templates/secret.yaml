apiVersion: v1
kind: Secret
metadata:
  name: {{ include "task-app.fullname" . }}-database
  labels:
    {{- include "task-app.postgresLabels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_USER: {{ .Values.postgres.auth.username | quote }}
  POSTGRES_PASSWORD: {{ .Values.postgres.auth.password | quote }}
  POSTGRES_DB: {{ .Values.postgres.auth.database | quote }}
  DATABASE_URL: {{ include "task-app.databaseURL" . | quote }}

